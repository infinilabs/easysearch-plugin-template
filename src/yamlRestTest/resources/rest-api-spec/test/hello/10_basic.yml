---
"hello endpoint returns greeting with explicit name":
  - do:
      hello:
        name: "tom"

  - match: { message: "Hello tom" }
  - match: { cluster_name: "yamlRestTest" }
  - match: { node_name: "/^yamlRestTest-[01]$/" }

---
"hello endpoint uses default name":
  - do:
      hello: {}

  - match: { message: "Hello World" }

